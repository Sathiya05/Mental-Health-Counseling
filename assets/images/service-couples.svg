<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
<filter id="grain-service-couples" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-service-couples" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter>
<linearGradient id="ab-service-couples" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E7EEEC"/><stop offset="1" stop-color="#FBF9F5"/>
</linearGradient>
<clipPath id="abclip-service-couples"><rect width="800" height="500"/></clipPath>
</defs>
<g clip-path="url(#abclip-service-couples)">
<rect width="800" height="500" fill="url(#ab-service-couples)"/>
<circle cx="240" cy="360" r="150" fill="#9BB49C"/>
<circle cx="416" cy="250" r="120" fill="#2E555C" opacity="0.85"/>
<g stroke="#2E555C" stroke-width="6" fill="none" opacity="0.7">
<path d="M 480 390 a 120 120 0 0 1 200 -70"/>
<path d="M 480 430 a 150 150 0 0 1 250 -90"/>
</g>
<rect width="800" height="500" filter="url(#grain-service-couples)" opacity="0.4" style="mix-blend-mode:multiply"/>
</g>
</svg>