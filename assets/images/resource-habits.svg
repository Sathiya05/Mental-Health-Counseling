<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
<filter id="grain-resource-habits" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-resource-habits" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter>
<linearGradient id="ab-resource-habits" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E7EEEC"/><stop offset="1" stop-color="#FBF9F5"/>
</linearGradient>
<clipPath id="abclip-resource-habits"><rect width="800" height="500"/></clipPath>
</defs>
<g clip-path="url(#abclip-resource-habits)">
<rect width="800" height="500" fill="url(#ab-resource-habits)"/>
<g fill="#9BB49C">
<rect x="90" y="300" width="140" height="120" rx="16"/>
<rect x="250" y="230" width="140" height="190" rx="16" opacity="0.9"/>
<rect x="410" y="160" width="140" height="260" rx="16" opacity="0.8"/>
</g>
<rect x="570" y="90" width="140" height="330" rx="16" fill="#2E555C" opacity="0.75"/>
<rect width="800" height="500" filter="url(#grain-resource-habits)" opacity="0.4" style="mix-blend-mode:multiply"/>
</g>
</svg>