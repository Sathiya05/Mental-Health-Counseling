<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
<filter id="grain-service-growth" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-service-growth" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter>
<linearGradient id="ab-service-growth" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#E4D9C8"/><stop offset="1" stop-color="#FBF9F5"/>
</linearGradient>
<clipPath id="abclip-service-growth"><rect width="800" height="500"/></clipPath>
</defs>
<g clip-path="url(#abclip-service-growth)">
<rect width="800" height="500" fill="url(#ab-service-growth)"/>
<path d="M 400 450 q -180 -180 40 -330 q 210 130 130 330 Z" fill="#D5C6AF"/>
<path d="M 400 450 q 190 -160 250 -300 q -120 90 -250 300 Z" fill="#9DC4C9" opacity="0.85"/>
<path d="M 400 450 v -280" stroke="#F7F3EC" stroke-width="7" opacity="0.7" stroke-linecap="round"/>
<rect width="800" height="500" filter="url(#grain-service-growth)" opacity="0.4" style="mix-blend-mode:multiply"/>
</g>
</svg>