<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
<filter id="grain-service-transition" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-service-transition" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter>
<linearGradient id="ab-service-transition" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F7F3EC"/><stop offset="1" stop-color="#FBF9F5"/>
</linearGradient>
<clipPath id="abclip-service-transition"><rect width="800" height="500"/></clipPath>
</defs>
<g clip-path="url(#abclip-service-transition)">
<rect width="800" height="500" fill="url(#ab-service-transition)"/>
<path d="M -40 330 q 200 -120 400 0 q 200 120 400 0 v 500 h -800 Z" fill="#E4D9C8" opacity="0.9"/>
<path d="M -40 390 q 200 -110 400 0 q 200 110 400 0 v 500 h -800 Z" fill="#D69A7B" opacity="0.75"/>
<circle cx="624" cy="120" r="66" fill="#FFFFFF" opacity="0.5"/>
<rect width="800" height="500" filter="url(#grain-service-transition)" opacity="0.4" style="mix-blend-mode:multiply"/>
</g>
</svg>