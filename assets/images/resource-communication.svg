<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
<filter id="grain-resource-communication" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-resource-communication" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter>
<linearGradient id="ab-resource-communication" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#F7F3EC"/><stop offset="1" stop-color="#FBF9F5"/>
</linearGradient>
<clipPath id="abclip-resource-communication"><rect width="800" height="500"/></clipPath>
</defs>
<g clip-path="url(#abclip-resource-communication)">
<rect width="800" height="500" fill="url(#ab-resource-communication)"/>
<path d="M 400 450 q -180 -180 40 -330 q 210 130 130 330 Z" fill="#E4D9C8"/>
<path d="M 400 450 q 190 -160 250 -300 q -120 90 -250 300 Z" fill="#D69A7B" opacity="0.85"/>
<path d="M 400 450 v -280" stroke="#F7F3EC" stroke-width="7" opacity="0.7" stroke-linecap="round"/>
<rect width="800" height="500" filter="url(#grain-resource-communication)" opacity="0.4" style="mix-blend-mode:multiply"/>
</g>
</svg>