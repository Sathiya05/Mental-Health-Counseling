<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img">
<defs>
<filter id="grain-map" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-map" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter></defs>
<rect width="800" height="500" fill="#E4D9C8"/>
<g stroke="#FBF9F5" stroke-width="26" stroke-linecap="round">
<path d="M -20 150 H 820 M -20 360 H 820 M 210 -20 V 520 M 560 -20 V 520"/>
</g>
<g stroke="#C2AD8E" stroke-width="6" stroke-dasharray="14 16" opacity="0.8">
<path d="M -20 260 H 820 M 380 -20 V 520"/>
</g>
<rect x="230" y="180" width="150" height="100" rx="10" fill="#D5C6AF" opacity="0.55"/>
<rect x="600" y="60" width="130" height="120" rx="10" fill="#D5C6AF" opacity="0.4"/>
<circle cx="400" cy="260" r="70" fill="#3F7C85" opacity="0.14"/>
<path d="M 400 300 c -26 -30 -40 -50 -40 -70 a 40 40 0 1 1 80 0 c 0 20 -14 40 -40 70 Z" fill="#3F7C85"/>
<circle cx="400" cy="228" r="15" fill="#FBF9F5"/>
<rect width="800" height="500" filter="url(#grain-map)" opacity="0.35" style="mix-blend-mode:multiply"/>
</svg>