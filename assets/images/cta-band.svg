<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img">
<defs>
<filter id="grain-ctaBand" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
</filter>
<filter id="soft-ctaBand" x="-25%" y="-25%" width="150%" height="150%">
<feGaussianBlur stdDeviation="18"/>
</filter>
<linearGradient id="wall-ctaBand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3F7C85"/><stop offset="1" stop-color="#2E555C"/>
</linearGradient>
<linearGradient id="ray-ctaBand" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="clip-ctaBand"><rect width="800" height="600"/></clipPath>
</defs>
<g clip-path="url(#clip-ctaBand)">
<rect width="800" height="600" fill="url(#wall-ctaBand)"/>
<circle cx="640" cy="130" r="120" fill="#FFFFFF" opacity="0.07"/>
<circle cx="140" cy="470" r="150" fill="#FFFFFF" opacity="0.05"/>
<g stroke="#FFFFFF" stroke-width="3" fill="none" opacity="0.16">
<path d="M 60 200 q 160 -90 320 0 q 160 90 320 0"/>
<path d="M 60 260 q 160 -90 320 0 q 160 90 320 0"/>
</g>
<circle cx="612" cy="410" r="54" fill="#E4D9C8" opacity="0.9"/>
<path d="M 596 410 h 32 M 612 394 v 32" stroke="#142B30" stroke-width="6" stroke-linecap="round"/>
<rect y="470" width="800" height="130" fill="#274A50"/>
<rect y="466" width="800" height="5" fill="#C2AD8E" opacity="0.45"/>
<rect width="800" height="600" filter="url(#grain-ctaBand)" opacity="0.45" style="mix-blend-mode:multiply"/>
</g>
</svg>